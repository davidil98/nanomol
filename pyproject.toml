[project]
name = "nanomol"
version = "0.2.0"
description = "Control de instrumentación para caracterización eléctrica y optoelectrónica de transistores (ICMAB-CSIC, grupo Nanomol)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "Nanomol group", email = "nanomol@icmab.es" }]
keywords = ["instrumentation", "keithley", "FET", "EGOFET", "characterization"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "PyQt6>=6.6",
    "pyqtgraph>=0.14",
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
    "pyvisa>=1.14",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
]
dist = [
    "pyinstaller>=6.10",
]

[project.gui-scripts]
nanomol = "nanomol.experiments.start_menu:main"

[project.scripts]
nanomol-transfer = "nanomol.entrypoints:transfer"
nanomol-output = "nanomol.entrypoints:output"
nanomol-timeseries = "nanomol.entrypoints:timeseries"

[project.urls]
Repository = "https://github.com/dean-nanomol/nanomol"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The .ui files are loaded at runtime by uic.loadUi() and the .ino files are
# the Arduino firmware. They are data, not python modules, so without this
# section a wheel would install the code without them.
[tool.setuptools.package-data]
"*" = ["*.ui"]
"nanomol.instruments" = ["arduino/*/*.ino"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
# the existing code uses camelCase for the method and class names of the
# instrument and experiment classes; renaming them is a separate change
ignore = ["N802", "N803", "N806"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
